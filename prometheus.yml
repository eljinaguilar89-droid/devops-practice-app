global:
  scrape_interval: 15s

# point Prometheus to Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

# load your alert rules
rule_files:
  - /etc/prometheus/rules.yml
  
scrape_configs:
  - job_name: 'app'
    static_configs:
      - targets: ['app:3000']
    metrics_path: /metrics